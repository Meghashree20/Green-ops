
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenops-frontend
  namespace: greenops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greenops-frontend
  template:
    metadata:
      labels:
        app: greenops-frontend
    spec:
      containers:
        - name: frontend
          image: greenops-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: greenops-frontend
  namespace: greenops
spec:
  type: NodePort
  selector:
    app: greenops-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
