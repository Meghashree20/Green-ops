apiVersion: v1
kind: ConfigMap
metadata:
  name: greenops-frontend-nginx
  namespace: greenops
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://greenops-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenops-frontend
  namespace: greenops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greenops-frontend
  template:
    metadata:
      labels:
        app: greenops-frontend
    spec:
      containers:
        - name: frontend
          image: greenops-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: greenops-frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: greenops-frontend
  namespace: greenops
spec:
  type: NodePort
  selector:
    app: greenops-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
