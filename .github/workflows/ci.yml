
name: GreenOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # 1. Backend tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -v

  # 2. Frontend checks
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

    # 3. Build and run Docker images locally on the runner (no push)
  docker-images:
    name: Build and Run Docker Images Locally (no push)
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (load into runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: |
            greenops-backend:local

      - name: Start backend container for smoke checks
        run: |
          docker run -d --name backend-local -p 8000:8000 greenops-backend:local || true
          for i in {1..20}; do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 3
          done
          docker ps -a

      - name: Backend smoke tests
        run: |
          curl -fsS http://localhost:8000/health

      - name: Build frontend image (load into runner)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: |
            greenops-frontend:local

      - name: Start frontend container for smoke checks
        run: |
          docker run -d --name frontend-local -p 3000:3000 greenops-frontend:local || true
          sleep 5
          docker ps -a

      - name: Frontend smoke tests
        run: |
          curl -fsS http://localhost:3000/ || true

      - name: Cleanup local containers
        if: always()
        run: |
          docker stop backend-local frontend-local || true
          docker rm backend-local frontend-local || true
  # 4. Deploy to Kubernetes
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Kubernetes secret
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        shell: bash
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "::error::KUBE_CONFIG secret is missing"
            exit 1
          fi
          echo "KUBE_CONFIG secret is available."

      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Check Kubernetes connection
        run: kubectl cluster-info

      - name: Apply Kubernetes manifests
        run: kubectl apply -k k8s/

      - name: Update backend image
        run: |
          kubectl set image deployment/greenops-backend \
            backend=${{ secrets.DOCKERHUB_USERNAME }}/greenops-backend:${{ github.sha }} \
            -n greenops

      - name: Update frontend image
        run: |
          kubectl set image deployment/greenops-frontend \
            frontend=${{ secrets.DOCKERHUB_USERNAME }}/greenops-frontend:${{ github.sha }} \
            -n greenops

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/greenops-backend \
            -n greenops --timeout=180s
          kubectl rollout status deployment/greenops-frontend \
            -n greenops --timeout=180s
          kubectl get pods,services,ingress -n greenops
